name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os == 'macOS'
        run: brew install coreutils
      - run: make check
      - run: make build
      - run: TZ=UTC ./bin/batz -j -t UTC 10h00 tomorrow >/dev/null
